eureka.client.service-url.defaultZone =http://eureka:password@localhost:8761/eureka/
spring.application.name=api-gateway

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.CachingRouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

##product service routes
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/api/product

##order-service routes
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/api/order

## discover server routes
spring.cloud.gateway.server.webflux.routes[2].id=discover-server
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[2].predicates=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/

## discover server routes static resources
spring.cloud.gateway.server.webflux.routes[3].id=discover-server-static
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[3].predicates=Path=/eureka/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/springboot-microservices-realm

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411