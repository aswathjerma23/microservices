spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://localhost:27017/productdb
eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka/
server:
  port: 0

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411